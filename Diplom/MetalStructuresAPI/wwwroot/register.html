<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - ООО "ТВК"</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="company-title" onclick="window.location.href='index.html'">ООО "ТВК"</h1>
        </header>

        <main class="main-content auth-content">
            <div class="auth-container">
                <h2>Регистрация</h2>
                
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="Введите email" required autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Телефон:</label>
                        <input type="tel" id="phone" class="js-phone-mask" placeholder="+7 (999) 123-45-67" required autocomplete="tel" maxlength="18">
                    </div>
                    
                    <div class="form-group">
                        <label for="fullName">ФИО:</label>
                        <input type="text" id="fullName" placeholder="Введите ФИО" required autocomplete="name">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" placeholder="Введите пароль (минимум 6 символов)" required autocomplete="new-password" minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">Подтверждение пароля:</label>
                        <input type="password" id="confirmPassword" placeholder="Повторите пароль" required autocomplete="new-password" minlength="6">
                    </div>
                    
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                    </div>
                </form>
                
                <div class="auth-links">
                    <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
                    <p><a href="index.html">Вернуться на главную</a></p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for messages -->
    <div id="modalOverlay" class="modal-overlay" onclick="if(event.target === this) closeModal()">
        <div class="modal" id="modal">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

    <script src="js/phone-mask.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Handle register form submission
        async function handleRegister(event) {
            event.preventDefault();
            
            const submitButton = event.target.querySelector('button[type="submit"]');
            if (submitButton) {
                submitButton.disabled = true;
                submitButton.textContent = 'Регистрация...';
            }
            
            try {
                const email = document.getElementById('email').value.trim();
                const phone = typeof getPhoneRaw === 'function' ? getPhoneRaw(document.getElementById('phone').value) : document.getElementById('phone').value.trim();
                const fullName = document.getElementById('fullName').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                // Validation
                if (!email || !phone || !fullName || !password || !confirmPassword) {
                    showModal('Внимание', 'Пожалуйста, заполните все поля', 'warning');
                    if (submitButton) {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Зарегистрироваться';
                    }
                    return;
                }
                
                if (password.length < 6) {
                    showModal('Внимание', 'Пароль должен содержать минимум 6 символов', 'warning');
                    if (submitButton) {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Зарегистрироваться';
                    }
                    return;
                }
                
                if (password !== confirmPassword) {
                    showModal('Внимание', 'Пароли не совпадают', 'warning');
                    if (submitButton) {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Зарегистрироваться';
                    }
                    return;
                }
                
                const response = await AuthManager.register(email, phone, fullName, password, confirmPassword);
                
                if (response && response.user) {
                    showModal('Успешно', 'Регистрация прошла успешно! Вы будете перенаправлены на главную страницу.', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    throw new Error('Не получен ответ от сервера');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showModal('Ошибка', error.message || 'Ошибка при регистрации', 'error');
                if (submitButton) {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Зарегистрироваться';
                }
            }
        }

        // Modal functions
        function showModal(title, message, type = 'info') {
            const overlay = document.getElementById('modalOverlay');
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalButtons = document.getElementById('modalButtons');
            
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            modal.classList.remove('modal-success', 'modal-error', 'modal-warning');
            modal.classList.add('modal-' + type);
            
            modalButtons.innerHTML = '<button class="modal-btn modal-btn-primary" onclick="closeModal()">OK</button>';
            
            overlay.classList.add('show');
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.remove('show');
        }

        // Redirect if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (AuthManager.checkAuth()) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
