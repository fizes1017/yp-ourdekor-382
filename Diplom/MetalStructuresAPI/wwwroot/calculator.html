<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор - ООО "ТВК"</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="company-title" onclick="window.location.href='index.html'">ООО "ТВК"</h1>
        </header>

        <nav class="navigation">
            <button class="nav-button" onclick="window.location.href='price-list.html'">Справочник цен</button>
            <button class="nav-button active" onclick="window.location.href='calculator.html'">Калькулятор</button>
            <button class="nav-button" onclick="window.location.href='profile.html'">Профиль</button>
            <button class="nav-button" onclick="AuthManager.logout()">Выход</button>
        </nav>

        <main class="main-content">
            <h2>Калькулятор</h2>
            
            <div class="search-section">
                <label for="searchInput">Поиск:</label>
                <input type="text" id="searchInput" placeholder="Введите название или артикул материала для поиска" onkeyup="searchMaterials()">
                <button class="btn btn-primary" onclick="showSearchResults()">Найти</button>
            </div>

            <div id="searchResults" class="search-results" style="display: none;">
                <h3>Результаты поиска:</h3>
                <div id="searchResultsList"></div>
            </div>

            <div class="table-section">
                <h3>Выбранные материалы:</h3>
                <table id="calculatorTable">
                    <thead>
                        <tr>
                            <th>Артикул</th>
                            <th>Название</th>
                            <th>Цена, в руб</th>
                            <th>Измерение</th>
                            <th>Количество</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="calculatorTableBody">
                        <!-- Данные будут загружены через JavaScript -->
                    </tbody>
                </table>
                
                <div class="total-section">
                    <p class="total-cost">Итоговая стоимость: <span id="totalAmount">0</span> руб.</p>
                    <div class="form-buttons" style="margin-top: 15px;">
                        <button class="btn btn-primary" onclick="saveCalculation()">Сохранить расчет</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for КП form (client data) -->
    <div id="kpModalOverlay" class="modal-overlay" onclick="if(event.target === this) closeKpModal()">
        <div class="modal kp-modal" style="max-width: 450px;">
            <div class="modal-title">Создать коммерческое предложение</div>
            <form id="kpForm" onsubmit="submitKpForm(event)">
                <div class="modal-form">
                    <div class="form-group">
                        <label>Компания контрагента *</label>
                        <input type="text" id="kpCustomerCompany" required placeholder="ООО «Название»">
                    </div>
                    <div class="form-group">
                        <label>Контактное лицо *</label>
                        <input type="text" id="kpCustomerPerson" required placeholder="Иванов И.И.">
                    </div>
                    <div class="form-group">
                        <label>Телефон *</label>
                        <input type="tel" id="kpCustomerPhone" class="js-phone-mask" required placeholder="+7 (999) 123-45-67" maxlength="18">
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="kpCustomerEmail" required placeholder="client@example.com">
                    </div>
                    <div class="form-group">
                        <label>Адрес (необязательно)</label>
                        <input type="text" id="kpCustomerAddress" placeholder="г. Москва, ул. Примерная, д. 1">
                    </div>
                    <div class="form-group">
                        <label>Комментарии (необязательно)</label>
                        <textarea id="kpComments" rows="2" placeholder="Дополнительная информация"></textarea>
                    </div>
                </div>
                <div class="modal-buttons" style="margin-top: 15px;">
                    <button type="button" class="modal-btn modal-btn-secondary" onclick="closeKpModal()">Отмена</button>
                    <button type="submit" class="modal-btn modal-btn-primary">Сформировать PDF</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for messages -->
    <div id="modalOverlay" class="modal-overlay" onclick="if(event.target === this) closeModal()">
        <div class="modal" id="modal">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

    <script src="js/phone-mask.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/kp-modal.js"></script>
    <script src="js/calculator.js"></script>
    <script>
        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', () => {
            if (!AuthManager.requireAuth()) {
                return;
            }
        });
    </script>
</body>
</html>
