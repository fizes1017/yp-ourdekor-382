<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - ООО "ТВК"</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="/images/logo.png" alt='Логотип ООО "ТВК"' class="company-logo">
            <h1 class="company-title" onclick="window.location.href='index.html'">ООО "ТВК"</h1>
        </header>

        <main class="main-content auth-content">
            <div class="auth-container">
                <h2>Вход в систему</h2>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="Введите email" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" placeholder="Введите пароль" required autocomplete="current-password">
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">Войти</button>
                    </div>
                </form>

                <div class="auth-links">
                    <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
                    <p><a href="index.html">Вернуться на главную</a></p>
                </div>
            </div>
        </main>
    </div>

    <!-- Модальное окно для сообщений -->
    <div id="modalOverlay" class="modal-overlay" onclick="if(event.target === this) closeModal()">
        <div class="modal" id="modal">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Обработка отправки формы входа
        async function handleLogin(event) {
            event.preventDefault();

            const submitButton = event.target.querySelector('button[type="submit"]');
            if (submitButton) {
                submitButton.disabled = true;
                submitButton.textContent = 'Вход...';
            }

            try {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    showModal('Внимание', 'Пожалуйста, заполните все поля', 'warning');
                    resetButton(submitButton);
                    return;
                }

                // Вызываем метод login из вашего AuthManager
                // Предполагается, что AuthManager.login сохраняет JWT токен в localStorage
                const response = await AuthManager.login(email, password);

                if (response && (response.user || response.token)) {
                    showModal('Успешно', 'Вы успешно вошли в систему!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    throw new Error('Неверный логин или пароль');
                }
            } catch (error) {
                console.error('Login error:', error);
                showModal('Ошибка', error.message || 'Ошибка при входе', 'error');
                resetButton(submitButton);
            }
        }

        function resetButton(button) {
            if (button) {
                button.disabled = false;
                button.textContent = 'Войти';
            }
        }

        // Функции модального окна
        function showModal(title, message, type = 'info') {
            const overlay = document.getElementById('modalOverlay');
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalButtons = document.getElementById('modalButtons');

            modalTitle.textContent = title;
            modalMessage.textContent = message;

            modal.classList.remove('modal-success', 'modal-error', 'modal-warning');
            modal.classList.add('modal-' + type);

            modalButtons.innerHTML = '<button class="modal-btn modal-btn-primary" onclick="closeModal()">OK</button>';

            overlay.classList.add('show');
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.remove('show');
        }

        // Если пользователь уже авторизован, перенаправляем на главную
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof AuthManager !== 'undefined' && AuthManager.checkAuth()) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
